# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_THEME
# Gruvbox Material Dark Hard
include current-theme.conf
# END_KITTY_THEME

font_size   16.0

background_opacity 0.9
background_blur 5
# background #1d2021
# tab_bar_background #1d2021

###########
# Tab bar #
###########

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

tab_bar_edge    bottom

tab_bar_margin_width 0.0

tab_bar_align   left

tab_bar_style   fade
#fade, slant, separator, powerline, custom, hidden

tab_title_template "{index}"
# active_tab_foreground   #442e2d
# active_tab_background   #d4be98
active_tab_font_style   bold
# inactive_tab_foreground #3c1f1e
# inactive_tab_background #7c6f64
inactive_tab_font_style normal

##########
# Window #
##########

map ctrl+alt+enter    launch --cwd=current
map ctrl+shift+enter  new_window

window_border_width 0.1pt

##########
# Layout #
##########

enabled_layouts fat

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
