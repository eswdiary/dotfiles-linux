background {
    path = /home/ewd/Pictures/Wallpaper/Gruvbox/wallpaper.png
    color = rgba(20, 20, 20, 1)
    blur_passes = 3
    blur_size = 7
}

image {
    monitor =     
    path = /home/ewd/Pictures/Logo/Logo_Black.jpg
    size = 100
    rounding = 8 # no rounding

    position = 0, 200
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(7daea3ee) rgba(a9b665ee) 45deg
    check_color=rgba(a9b665ee) rgba(e78a41ee) 120deg
    fail_color=rgba(e78a41ee) rgba(ea6962ee) 40deg

    placeholder_text = Password

    font_color = rgb(143, 143, 143)
    fade_on_empty = true
    rounding = 15

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER > $TIME
    color = rgba(200, 200, 200, 1.0)
    font_size = 40
    font_family = JetBrainsMono NF, monospace

    position = 0, 80
    halign = center
    valign = center
}
