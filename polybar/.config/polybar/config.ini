include-file = ~/.config/polybar/modules.ini
include-file = ~/.config/polybar/colors.ini

[bar/base]
width = 99%
height = 30pt 

offset-x = 0.5%
offset-y = 0.5%

; Value used for drawing rounded corners
; Note: This shouldn't be used together with border-size because the border
; doesn't get rounded
; Individual top/bottom values can be defined using:
;   radius-{top,bottom}
radius-top = 5.0
radius-bottom = 10.0

monitor = ${env:MONITOR:}

bottom = false 

; Prefer fixed center position for the `modules-center` block
; When false, the center position will be based on the size of the other blocks.
fixed-center = true

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-top-size = 0
border-color = 

padding-left = 15pt
padding-right = 20pt

module-margin = 2

separator = |
separator-foreground = ${colors.disabled}

; Font
font-0 = "RobotoMono Nerd Font Mono:size=12"

; Position
modules-left = date cpu memory backlight
modules-center= bspwm
modules-right = xwindow pulseaudio wlan eth batery power

cursor-click = pointer
cursor-scroll = ns-resize

; Enable support for inter-process messaging
; See the Messaging wiki page for more details.
enable-ipc = true

; active or not
tray-position = none
; tray-background = ${colors.background}
; tray-foreground = ${colors.foreground}

; If true, the bar will not shift its
; contents when the tray changes
; tray-detached = false

; Tray icon max size
; tray-maxsize = 16
 
; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; Background colors for the tray container
; ARGB colors (e.g. #f00, #ff992a, #ddff1023)
; By default the tray container will use the bar
; background colors.
; tray-background = ${colors.background}

; Tell the Window Manager not to configure the window.
; Use this to detach the bar if your WM is locking its size/position.
; Note: With this most WMs will no longer reserve space for 
; the bar and it will overlap other windows. You need to configure
; your WM to add a gap where the bar will be placed.
override-redirect = true

scroll-up = #bspwm.prev
scroll-down = #bspwm.next

[settings]
screenchange-reload = true
pseudo-transparency = true

