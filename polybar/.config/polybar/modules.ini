[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

; [module/filesystem]
; type = internal/fs
; interval = 25
; 
; mount-0 = /
; 
; label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%
; 
; label-unmounted = %mountpoint% not mounted
; label-unmounted-foreground = ${colors.disabled}


; Sys volume ctl

[module/bspwm]
type = internal/bspwm

; Only show workspaces defined on the same output as the bar
; NOTE: The bspwm and XRandR monitor names must match, which they do by default.
; But if you rename your bspwm monitors with bspc -n this option will no longer
; behave correctly.
; Default: true
pin-workspaces = true

; Use fuzzy (partial) matching on labels when assigning 
; icons to workspaces
; Example: code;♚ will apply the icon to all workspaces 
; containing 'code' in the label
; Default: false
fuzzy-match = false

ws-icon-0 = I;
ws-icon-1 = II;
ws-icon-2 = III;
ws-icon-3 = IV;
ws-icon-4 = V;
ws-icon-5 = VI;
ws-icon-6 = VII;
ws-icon-7 = VIII;
ws-icon-default = 


; Available tokens:
;   %name%
;   %icon%
;   %index%
; Default: %icon% %name%
label-focused = %name%
label-focused-foreground = ${colors.foreground}
label-focused-background = ${colors.background-alt}
label-focused-padding = 1

; Available tokens:
;   %name%
;   %icon%
;   %index%
; Default: %icon% %name%
label-urgent = %icon%
label-urgent-foreground = ${colors.red-alt}
label-urgent-background = ${colors.background}
label-urgent-padding = 1

; Available tokens:
;   %name%
;   %icon%
;   %index%
; Default: %icon% %name%
label-occupied = %icon%
label-occupied-foreground = ${colors.blue}
label-occupied-background = ${colors.background}
label-occupied-padding = 1

; Available tokens:
;   %name%
;   %icon%
;   %index%
; Default: %icon% %name%
label-empty = %icon%
label-empty-foreground = ${colors.grey}
label-empty-background = ${colors.background}
label-empty-padding = 1


[module/pulseaudio]
type = internal/pulseaudio

interval = 5

; Use PA_VOLUME_UI_MAX (~153%) if true, or PA_VOLUME_NORM (100%) if false
; Default: true
use-ui-max = false 

format-volume-prefix = "󰕾 "
format-volume-foreground = ${colors.purple-alt}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = 
format-muted-foreground = ${colors.purple}

click-right = pavucontrol
click-middle = flatpak run org.rncbc.qpwgraph

[module/backlight]
type = internal/backlight
format = <label>
label = "󰃞 %percentage%%"
card = amdgpu_bl1
use-actual-brightness = true
format-foreground = ${colors.yellow}
; Need add user to video group with write-privileges
enable-scroll = true
scroll-interval = 10

[module/battery]
type = internal/battery
full-at = 100
low-at = 5
battery = BAT1
adapter = ACAD

; [module/xkeyboard]
; type = internal/xkeyboard
; ; blacklist-0 = num lock
; 
; label-layout = %variant%
; label-layout-foreground = ${colors.primary}
; 
; label-indicator-padding = 2
; label-indicator-margin = 1
; label-indicator-foreground = ${colors.background}
; label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-foreground = ${colors.purple-alt}
label = %percentage_used:2%%
; New in version 3.6.0
warn-percentage = 90

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-foreground = ${colors.aqua}
label = %percentage:2%%

; --------------------------------------------------
[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
; label-disconnected = %{F#F0C674}%ifname%%{F#707880} X
label-disconnected = %{F#F0c674}%{F#707880} X

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %netspeed%

[module/eth]
inherit = network-base
interface-type = wired
; label-connected = %{F#F0C674}%ifname%%{F-} %netspeed%
label-connected = %{F#F0C674}%{F-} %netspeed%
; --------------------------------------------------

[module/date]
type = internal/date
interval = 1

date = %y%m%d | %H%M
date-alt = %y%m%d | %H%M%S

label = %date%
label-foreground = ${colors.freoground-alt}
