    insertMatchingTokens: true
    lineWrap: false
    showWhitespace: false
    spaceIndent: false
    stepForwardEvaluation: false
    theme: monokai
    themes:
      base16-gruvbox-dark-hard:
        built-in: !textFormat
          color: "#d3869b"
          background: "#1d2021"
          italic: false
